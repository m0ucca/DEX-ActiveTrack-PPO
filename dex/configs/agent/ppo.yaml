name: PPO
device: ${device}
discount: 0.99
gae_lambda: 0.95
reward_scale: 1
n_seed_steps: 0     # on-policy: no random seed episodes

actor_lr: 3e-4
critic_lr: 3e-4
n_rollout_episodes: 20  # episodes collected per PPO update
ppo_epochs: 10
minibatch_size: 256
clip_ratio: 0.2
vf_coef: 0.5
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: 0.05     # null to disable early stopping
clip_obs: 200
norm_clip: 5
norm_eps: 0.01
hidden_dim: 256
sampler:            # only used for the shared normalizer / buffer setup
  type: her
  strategy: future
  k: 4